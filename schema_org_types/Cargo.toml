[package]
name = "schema_org_types"
description = "Schema.org schemas as Rust types"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = [".github", "rustfmt.toml"]

# https://docs.rs/about/metadata
[package.metadata.docs.rs]
features = [
    "doc",
]

[dependencies]
json-number = "0.4.10"
serde = { version = "1.0.229", features = ["default"], optional = true }
serde_with = { version = "3.24.0", optional = true }
speedate = "0.17.0"
url = "2.5.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1.0.151"

[features]
default = []
derive-all = ["derive-debug", "derive-clone", ]
derive-debug = []
derive-clone = []
fallible = []
serde = [
    "dep:serde",
    "dep:serde_with",
    "json-number/serde",
    "url/serde",
]
doc = []
test = [
    "fallible",
    "serde",
]

